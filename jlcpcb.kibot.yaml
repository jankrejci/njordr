# Gerber and drill files for JLCPCB, without a stencil. The fab house
# lives at https://jlcpcb.com/. The settings are based on those of
# Gerber Zipper at https://github.com/g200kg/kicad-gerberzipper.
kibot:
  version: 1

preflight:
  erc:
    dir: tmp
    enabled: true
    # TODO resolve issues and enable this again
    warnings_as_errors: false
  drc:
    dir: tmp
    enabled: true
    # TODO the first-iteration board still has many benign DRC warnings.
    # Resolve them and re-enable warnings_as_errors:
    # - silk_overlap: overlapping silkscreen reference designators
    # - footprint_filters_mismatch: custom library footprints do not
    #   match the default symbol filters; rename the library footprints
    #   or add matching footprint filters to the symbols
    # - missing_footprint: simulation-only parts such as sources and net
    #   ties are not excluded from the board
    warnings_as_errors: false
  check_zone_fills: true

filters:
  - name: only_jlc_parts
    comment: 'Only parts with JLC (LCSC) code'
    type: generic
    include_only:
      - column: 'LCSC'
        regex: '^C\d+'

variants:
  - name: rotated
    comment: 'Placeholder variant that applies the rotation filter'
    type: kibom
    variant: rotated
    pre_transform: _rot_footprint

outputs:
  - name: JLCPCB_gerbers
    comment: Gerbers compatible with JLCPCB
    type: gerber
    dir: JLCPCB
    options: &gerber_options
      exclude_edge_layer: true
      exclude_pads_from_silkscreen: true
      plot_sheet_reference: false
      plot_footprint_refs: true
      plot_footprint_values: false
      force_plot_invisible_refs_vals: false
      tent_vias: true
      use_protel_extensions: true
      create_gerber_job_file: false
      disable_aperture_macros: true
      gerber_precision: 4.6
      use_gerber_x2_attributes: false
      use_gerber_net_attributes: false
      line_width: 0.1
      subtract_mask_from_silk: true
      inner_extension_pattern: '.g%n'
    layers:
      - F.Cu
      - B.Cu
      - In1.Cu
      - In2.Cu
      - F.SilkS
      - B.SilkS
      - F.Mask
      - B.Mask
      - Edge.Cuts

  - name: JLCPCB_drill
    comment: Drill files compatible with JLCPCB
    type: excellon
    dir: JLCPCB
    options:
      pth_and_npth_single_file: false
      pth_id: '-PTH'
      npth_id: '-NPTH'
      metric_units: true
      map: gerber
      route_mode_for_oval_holes: false
      output: "%f%i.%x"

  - name: 'JLCPCB_position'
    comment: "Pick and place file, JLCPCB style"
    type: position
    options:
      variant: rotated
      output: '%f-cpl.%x'
      format: CSV
      units: millimeters
      separate_files_for_front_and_back: false
      only_smd: true
      columns:
        - id: Ref
          name: Designator
        - Val
        - Package
        - id: PosX
          name: "Mid X"
        - id: PosY
          name: "Mid Y"
        - id: Rot
          name: Rotation
        - id: Side
          name: Layer

  - name: 'JLCPCB_bom'
    comment: "BoM for JLCPCB"
    type: bom
    options:
      output: '%f-bom.%x'
      exclude_filter: 'only_jlc_parts'
      ref_separator: ','
      columns:
        - field: Value
          name: Comment
        - field: References
          name: Designator
        - Footprint
        - field: 'LCSC'
          name: 'LCSC Part #'
      csv:
        hide_pcb_info: true
        hide_stats_info: true
        quote_all: true

  - name: JLCPCB
    comment: ZIP file for JLCPCB
    type: compress
    options:
      output: '%f-fab.%x'
      move_files: true
      files:
        - from_output: JLCPCB_gerbers
          dest: /
        - from_output: JLCPCB_drill
          dest: /

  - name: DOCS_schematics
    comment: Schematics documentation
    type: pdf_sch_print
    options:
      output: '%f-sch.%x'

  - name: DOCS_pcb
    comment: PCB documentation
    type: pcb_print
    options:
      output: '%f-pcb.%x'
      format: 'PDF'
      pages:
      - layers:
          - layer: "Edge.Cuts"
            description: "Edge Cuts Layer"
          - layer: "F.Cu"
            description: "Front Copper Layer"
          - layer: "F.SilkS"
            description: "Front Silkscreen Layer"
        scaling: 1.0
