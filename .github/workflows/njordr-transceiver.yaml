name: njordr-transceiver-gerbers

on:
  pull_request:
    paths:
    - 'njordr-transceiver/*.kicad_sch'
    - 'njordr-transceiver/*.kicad_pcb'
    - 'njordr-transceiver/*.kibot.yaml'
    - '.github/workflows/njordr-transceiver.yaml'
  workflow_dispatch:
    inputs:
      name:
        description: 'Workflow run name'
        required: false
        default: 'Njordr transceiver gerbers'
  
jobs:
  jlcpcb:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: INTI-CMNB/KiBot@v2_k9
      with:
        config: jlcpcb.kibot.yaml
        dir: output
        schema: 'njordr-transceiver/njordr-transceiver.kicad_sch'
        board: 'njordr-transceiver/njordr-transceiver.kicad_pcb'
    - name: 'Cleanup build folder'
      run: sudo rm -rf ./output/tmp
    - name: 'Upload results'
      uses: actions/upload-artifact@v4
      with:
        name: njordr-transceiver-jlcpcb
        path: output
